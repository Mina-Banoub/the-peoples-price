<title>The People's Price</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500;75..100,700;75..100,800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: shelf-tag cards in a responsive grid under a single ruled header; receipt-style mono for every price */
:root{
  --bg:#F3F5F7; --paper:#FFFFFF; --ink:#0E1621; --muted:#5A6573; --rule:#D5DBE2;
  --tag:#FFD23F; --tag-ink:#1A1400; --over:#C2362B; --over-soft:#FBE3E0; --under:#1E7A4B; --under-soft:#DDF2E6; --link:#1F55A8;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"Public Sans",system-ui,-apple-system,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1117; --paper:#161C24; --ink:#E8ECF1; --muted:#9AA5B3; --rule:#2B3440;
  --tag:#F2C531; --tag-ink:#1A1400; --over:#F2776B; --over-soft:#3A1E1C; --under:#5BCB8E; --under-soft:#173226; --link:#8DB4F0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1117; --paper:#161C24; --ink:#E8ECF1; --muted:#9AA5B3; --rule:#2B3440;
  --tag:#F2C531; --tag-ink:#1A1400; --over:#F2776B; --over-soft:#3A1E1C; --under:#5BCB8E; --under-soft:#173226; --link:#8DB4F0; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;font-size:15px}
.wrap{max-width:1080px;margin:0 auto;padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:28px}
.wrap>*{min-width:0}
header{display:grid;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand .stamp{font-family:var(--display);font-weight:800;font-stretch:75%;text-transform:uppercase;letter-spacing:.04em;font-size:12px;background:var(--tag);color:var(--tag-ink);padding:3px 8px;border-radius:3px}
h1{font-family:var(--display);font-weight:800;font-stretch:80%;font-size:clamp(38px,8vw,72px);line-height:.95;margin:0;letter-spacing:-.01em;text-wrap:balance}

.controls{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end}

select,input{font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:9px 10px;min-width:0}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.fact{background:var(--paper);padding:12px 14px;display:grid;gap:2px}
.fact b{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.fact span{font-size:12.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.sh{display:grid;gap:2px;margin-bottom:12px}
.sh p{margin:0;color:var(--muted);font-size:14px}
.sh-row{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.feat h2{display:flex;align-items:center;gap:10px}
.tbox{overflow-x:auto;background:var(--paper);border:1px solid var(--rule);border-radius:8px}
.pt{width:100%;min-width:720px;border-collapse:collapse;font-size:14px}

.pt .dt{display:block;font-family:var(--body);font-size:11.5px;color:var(--muted)}

.row{white-space:nowrap}
.row{display:flex;justify-content:space-between;gap:10px}

.verdict.over{background:var(--over-soft);color:var(--over)}
.verdict.under{background:var(--under-soft);color:var(--under)}
.verdict.none{color:var(--muted);font-weight:500}

.check{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:16px;display:grid;gap:14px}
.check form{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.check .money{position:relative}
.check .money input{padding-left:22px;width:120px}
.check .money::before{content:"$";position:absolute;left:10px;bottom:10px;color:var(--muted);font-size:15px}
button{font:inherit;font-weight:600;font-size:15px;border-radius:6px;padding:9px 16px;background:var(--ink);color:var(--bg);border:1px solid var(--ink);cursor:pointer}
.result{font-size:16px;min-height:1.5em}
.result b{font-family:var(--mono)}
.result.over b{color:var(--over)} .result.under b{color:var(--under)}
.method{display:grid;gap:8px;font-size:14px;color:var(--muted);max-width:75ch}

.search{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.2fr) minmax(0,1fr) auto;gap:12px;align-items:end;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:14px;box-shadow:6px 6px 0 var(--tag)}
[hidden]{display:none!important}
.search label{font-size:12px;display:block}
.search label>input,.search label>select,.search label>.money{margin-top:6px}
.search .opt{margin-left:4px}
.search .opt{font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted);opacity:.8}

.search .money{display:block}

.quick{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}

.qchip:hover{border-color:var(--ink)}

.ans-text{display:grid;gap:10px;min-width:0}
.ans-text h2{font-family:var(--display);font-weight:800;font-stretch:80%;font-size:clamp(26px,4vw,40px);line-height:1.05;margin:0;text-wrap:balance}
.ans-text h2 em{font-style:normal}
.ans-text h2 em.over{color:var(--over)} .ans-text h2 em.under{color:var(--under)}
.ans-text p{margin:0;font-size:16px;max-width:60ch}
.ans-text b{font-family:var(--mono);font-weight:600}
.ans-text .you{font-size:17px;padding:10px 12px;border-radius:6px;background:var(--paper);border:1px solid var(--rule)}
.ans-text .you.over{background:var(--over-soft);border-color:transparent} .ans-text .you.under{background:var(--under-soft);border-color:transparent}
.ans-text .also{font-size:13px;color:var(--muted);line-height:2}
.more-wrap{display:flex;justify-content:center}
.more{background:transparent;color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:11px 22px;font-size:15px}
.more:hover{background:var(--ink);color:var(--bg)}
.full{display:grid;gap:28px}
.full>*{min-width:0}
@media (max-width:760px){.search{grid-template-columns:1fr 1fr}.search .f-item{grid-column:1/-1}.go{grid-column:1/-1}.answer{grid-template-columns:1fr}.ans-card{max-width:320px}}
.facts{margin-top:-6px}
.ladder{display:grid;gap:10px;margin-top:4px;max-width:560px}
.ladder .lr{display:grid;grid-template-columns:124px minmax(0,1fr) 70px;gap:12px;align-items:center;font-size:14px}
.ladder .lr span{color:var(--muted);white-space:nowrap}
.ladder .lr b{font-family:var(--mono);font-weight:600;text-align:right;font-size:15px}
.ladder .tr{height:24px;background:var(--rule);border-radius:3px;overflow:hidden}
.ladder .tr i{display:block;height:100%;border-radius:3px}
.ladder .b19 i{background:var(--muted);opacity:.55}
.ladder .b2 i{background:var(--muted)}
.ladder .bpp i{background:var(--tag)}
.ladder .bnow.over i{background:var(--over)} .ladder .bnow.under i{background:var(--under)} .ladder .bnow.none i{background:var(--ink)}
.ladder .byou i{background:var(--link)}
.ladder .lr.bpp span{color:var(--ink);font-weight:600}
@media (prefers-reduced-motion:no-preference){.ladder .tr i{animation:grow .6s ease-out both}@keyframes grow{from{transform:scaleX(.02);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}}
.glance{min-width:0}
.gl-key{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.gl-key .sw{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.sw.over{background:var(--over)} .sw.under{background:var(--under)}
.gl{display:grid;gap:3px;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:12px 14px}
.gl button{all:unset;cursor:pointer;display:grid;grid-template-columns:150px minmax(0,1fr) 52px;gap:10px;align-items:center;font-size:13px;padding:2px 4px;border-radius:4px}
.gl button:hover,.gl button:focus-visible{background:var(--bg)}
.gl button:focus-visible{outline:2px solid var(--link)}
.gl .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl .tk{position:relative;height:12px}
.gl .tk::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;border-left:1px solid var(--ink);opacity:.5}
.gl .tk i{position:absolute;top:0;height:100%;border-radius:2px}
.gl .tk i.over{left:50%;background:var(--over)} .gl .tk i.under{right:50%;background:var(--under)}
.gl .v{font-family:var(--mono);font-size:12px;text-align:right}
.gl .v.over{color:var(--over)} .gl .v.under{color:var(--under)}
.gl .ax{display:grid;grid-template-columns:150px minmax(0,1fr) 52px;gap:10px;font-family:var(--mono);font-size:11px;color:var(--muted);padding:0 4px}
.gl .ax div{display:flex;justify-content:space-between}
.tbox{position:relative}
.tbox.fog{max-height:calc(10 * 51px + 100px);overflow:hidden}
.tbox.fog::after{content:"";position:absolute;left:0;right:0;bottom:0;height:110px;background:linear-gradient(to bottom,transparent,var(--paper) 85%);pointer-events:none}
.fogbtn{display:flex;justify-content:center;margin-top:-26px;position:relative;z-index:1}
.fogbtn .more{background:var(--paper)}
.fogbtn.open{margin-top:14px}
.ico{width:15px;height:15px;vertical-align:-3px;margin-right:5px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tag .cat{display:inline-flex;align-items:center}
@media (max-width:560px){.gl button,.gl .ax{grid-template-columns:96px minmax(0,1fr) 44px;gap:6px}.ladder .lr{grid-template-columns:96px minmax(0,1fr) 58px}}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--rule);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.topin{max-width:1080px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;height:56px}
.mark{font-family:var(--display);font-weight:800;font-stretch:80%;font-size:19px;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:8px;white-space:nowrap}
.mark .dot{width:14px;height:14px;background:var(--tag);border-radius:3px;transform:rotate(45deg)}
.tabs{display:flex;gap:4px}

.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tabs a:focus-visible,.mark:focus-visible,.browse:focus-visible{outline:2px solid var(--link);outline-offset:2px}
main{display:grid;gap:28px;min-width:0}
main>*{min-width:0}
details.method{max-width:none;display:block;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:0}
details.method summary{list-style:none;cursor:pointer;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:800;font-stretch:80%;font-size:22px;color:var(--ink)}
details.method summary::-webkit-details-marker{display:none}

.browse{justify-self:start;font-weight:600;color:var(--ink);text-decoration:none;border-bottom:2px solid var(--tag);padding-bottom:2px;font-size:16px}

.h-all{font-size:clamp(40px,8vw,64px)}

.m-body p{margin:0}

.m-body .formula{font-size:14px;padding:12px 14px}
.m-body .m-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--rule);padding-top:12px}

.sw2.syou{background:var(--link)}

</style>
