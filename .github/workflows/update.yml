name: Monthly price update

on:
  schedule:
    # 16th of each month, 15:17 UTC — after BLS publishes the CPI and average prices (usually the 10th–15th).
    - cron: "17 15 16 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: price-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch BLS data and rebuild data.json
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: python3 scripts/update.py
      - name: Show the data report
        run: cat data/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- docs/data.json data/report.md; then
            echo "No changes."
            exit 0
          fi
          ASOF=$(python3 -c "import json;print(json.load(open('docs/data.json'))['asof'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json data/report.md
          git commit -m "Data update: prices through ${ASOF}"
          git push
